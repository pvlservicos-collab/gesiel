<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Cadastro de Apoiador — Aldo Maurício</title>
  <link rel="icon" type="image/webp" href="img/logo.webp">
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&family=DM+Sans:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --azul: #091f80;
      --azul-esc: #050e52;
      --azul-med: #0e2eaa;
      --ouro: #f5c518;
      --ouro-esc: #c8a000;
      --verde: #1a8c2a;
      --text-esc: #0a1540;
      --text-med: #3a4a7a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html {
      overflow-x: hidden
    }

    body {
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      color: var(--text-esc);
      background: radial-gradient(circle at 50% -10%, var(--azul-med) 0%, var(--azul) 45%, var(--azul-esc) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      position: relative;
      overflow: hidden;
    }

    .estrelas {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .estrelas i {
      position: absolute;
      display: block;
      border-radius: 50%;
      background: #fff;
      opacity: .5;
      animation: pisca 2.4s ease-in-out infinite;
    }

    @keyframes pisca {

      0%,
      100% {
        opacity: .15
      }

      50% {
        opacity: .8
      }
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
    }

    .topo {
      text-align: center;
      margin-bottom: 22px;
    }

    .topo img {
      height: 84px;
      margin-bottom: 14px;
    }

    .topo h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: clamp(1.9rem, 5vw, 2.4rem);
      color: var(--azul-esc);
      line-height: 1.1;
    }

    .topo p {
      color: var(--text-med);
      font-size: .95rem;
      margin-top: 8px;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 32px 28px;
      box-shadow: 0 24px 60px rgba(5, 14, 82, .45);
    }

    .fg {
      margin-bottom: 16px;
    }

    .fg label {
      display: block;
      font-size: .82rem;
      font-weight: 600;
      color: var(--text-med);
      margin-bottom: 6px;
    }

    .fg input {
      width: 100%;
      padding: 13px 14px;
      border: 1.5px solid #dfe3f2;
      border-radius: 10px;
      font: inherit;
      font-size: 1rem;
      color: var(--text-esc);
      background: #f8f9fd;
    }

    .fg input:focus {
      outline: none;
      border-color: var(--azul-med);
      background: #fff;
    }

    .ac-wrap {
      position: relative;
    }

    .ac-list {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: #ffffff;
      border: 1.5px solid #dfe3f2;
      border-radius: 10px;
      max-height: 220px;
      overflow-y: auto;
      box-shadow: 0 14px 34px rgba(5, 14, 82, .2);
      z-index: 20;
      display: none;
    }

    .ac-list.show {
      display: block;
    }

    .ac-item {
      padding: 10px 14px;
      font-size: .95rem;
      color: var(--text-esc);
      cursor: pointer;
    }

    .ac-item:hover {
      background: #f0f3fc;
      color: var(--azul-med);
    }

    .ac-empty {
      padding: 10px 14px;
      font-size: .88rem;
      color: var(--text-med);
    }

    .btn-cadastrar {
      width: 100%;
      padding: 15px;
      margin-top: 6px;
      background: var(--ouro);
      border: none;
      border-radius: 10px;
      font: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--azul-esc);
      cursor: pointer;
      transition: filter .15s ease;
    }

    .btn-cadastrar:hover {
      filter: brightness(1.06);
    }

    .btn-cadastrar:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .consentimento {
      margin-top: 10px;
      font-size: .72rem;
      color: #949494;
      text-align: center;
      line-height: 1.5;
    }

    .consentimento a {
      color: #949494;
      text-decoration: underline;
    }

    .msg {
      margin-top: 14px;
      font-size: .88rem;
      text-align: center;
      display: none;
    }

    .msg.erro {
      color: #b33a2e;
    }

    .sucesso {
      text-align: center;
      padding: 26px 22px;
      display: none;
      background: #eaf8ee;
      border: 1.5px solid #bfe8c9;
      border-radius: 14px;
    }

    .sucesso .check {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--verde);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto 16px;
    }

    .sucesso h2 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.5rem;
      color: var(--verde);
      margin-bottom: 8px;
    }

    .sucesso p {
      color: var(--text-med);
      font-size: .95rem;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div class="estrelas" id="estrelas"></div>

  <div class="wrap">
    <div class="card">
      <div class="topo">
        <img src="img/logo.webp" alt="Aldo Maurício">
        <h1>Cadastro de Apoiador</h1>
        <p>Faça parte do movimento com Aldo Maurício. Preencha seus dados abaixo.</p>
      </div>

      <form id="form-apoiador">
        <div class="fg">
          <label for="l-nome">Nome completo</label>
          <input type="text" id="l-nome" placeholder="Seu nome completo" required>
        </div>
        <div class="fg">
          <label for="l-numero">WhatsApp</label>
          <input type="tel" id="l-numero" placeholder="(00) 00000-0000" required>
        </div>
        <div class="fg ac-wrap" id="bairro-wrap">
          <label for="l-bairro">Bairro</label>
          <input type="text" id="l-bairro" placeholder="Digite seu bairro" autocomplete="off" required>
          <div class="ac-list" id="bairro-list"></div>
        </div>
        <div class="fg">
          <label for="l-mae">Nome da mãe</label>
          <input type="text" id="l-mae" placeholder="Nome completo da sua mãe" required>
        </div>
        <div class="fg">
          <label for="l-nascimento">Data de nascimento</label>
          <input type="date" id="l-nascimento" required>
        </div>
        <div class="fg">
          <label for="l-endereco">Endereço</label>
          <input type="text" id="l-endereco" placeholder="Rua e número" required>
        </div>
        <div class="fg ac-wrap" id="indicado-wrap">
          <label for="l-indicado">Quem pediu para você apoiar Aldo Maurício? <span style="font-weight:400;opacity:.7">(opcional)</span></label>
          <input type="text" id="l-indicado" placeholder="Nome da liderança" autocomplete="off">
          <input type="hidden" id="l-indicado-id">
          <div class="ac-list" id="indicado-list"></div>
        </div>
        <button type="submit" class="btn-cadastrar" id="btn-cadastrar">Cadastrar</button>
        <p class="consentimento">Ao enviar, concordo com a <a href="/politicadeprivacidade">política de privacidade e dados</a>.</p>
        <div class="msg erro" id="msg-erro"></div>
      </form>

      <div class="sucesso" id="sucesso">
        <div class="check">✓</div>
        <h2>Cadastro recebido!</h2>
        <p>Obrigado por se juntar ao movimento.</p>
      </div>
    </div>
  </div>

  <script>
    (function criarEstrelas() {
      const c = document.getElementById('estrelas');
      for (let i = 0; i < 50; i++) {
        const s = document.createElement('i');
        const size = Math.random() * 2.2 + 1;
        s.style.cssText = `left:${Math.random() * 100}%;top:${Math.random() * 100}%;width:${size}px;height:${size}px;animation-delay:${(Math.random() * 2).toFixed(1)}s;animation-duration:${(Math.random() * 1.6 + 1.6).toFixed(1)}s`;
        c.appendChild(s);
      }
    })();

    const BAIRROS_MACAPA = [
      'Açaí', 'Alvorada', 'Amazonas', 'Araxá', 'Beirol', 'Bella Ville', 'Bioparque', 'Boné Azul',
      'Brasil Novo', 'Buritis', 'Buritizal', 'Cabralzinho', 'Cajari', 'Central', 'Chefe Clodoaldo',
      'Cidade Nova', 'Congós', 'Coração', 'Fazendinha', 'Goiabal', 'Igarapé de Fortaleza', 'Ilha Mirim',
      'Infraero I', 'Infraero II', 'Ipê', 'Jardim América', 'Jardim das Acácias', 'Jardim Equatorial',
      'Jardim Felicidade', 'Jardim Felicidade I', 'Jardim Felicidade II', 'Jardim Marco Zero',
      'Jesus de Nazaré', 'Lago da Vaca', 'Lagoa Azul', 'Laguinho', 'Macapaba', 'Marabaixo I',
      'Marabaixo II', 'Marabaixo III', 'Morada das Palmeiras', 'Muca', 'Murici', 'Nova Esperança',
      'Novo Buritizal', 'Novo Horizonte', 'Pacoval', 'Palácio das Águas', 'Pantanal',
      'Parque Aeroportuário', 'Parque dos Jardins', 'Pedrinhas', 'Perpétuo Socorro', 'Quilômetro Nove',
      'Renascer', 'Santa Inês', 'Santa Rita', 'São José', 'São Lázaro', 'Sol Nascente', 'Trem',
      'Universidade', 'Vale Verde', 'Zerão',
      // municípios vizinhos (Região Metropolitana de Macapá) — prefixo evita
      // confundir com bairro de mesmo nome em Macapá (ex.: Central, Novo Horizonte)
      'Santana-Central', 'Santana-Comercial', 'Santana-Daniel', 'Santana-Distrito Industrial',
      'Santana-Elesbão', 'Santana-Fonte Nova', 'Santana-Fortaleza', 'Santana-Hospitalidade',
      'Santana-Ilha de Santana', 'Santana-Nova Brasília', 'Santana-Novo Horizonte', 'Santana-Paraíso',
      'Santana-Provedor', 'Santana-Provedor I', 'Santana-Remédios', 'Santana-Vila Amazonas',
      'Mazagão-Centro', 'Mazagão-Vila do Carvão', 'Mazagão-Mazagão Velho',
      'Laranjal do Jari-Centro', 'Laranjal do Jari-Agreste', 'Laranjal do Jari-Bom Jesus',
      'Laranjal do Jari-Sumaúma', 'Laranjal do Jari-Santarém', 'Laranjal do Jari-Guerreiros',
      'Laranjal do Jari-Dos Atletas', 'Laranjal do Jari-Coração de Jesus', 'Laranjal do Jari-Liberdade',
      'Laranjal do Jari-Novo Horizonte', 'Laranjal do Jari-Prosperidade',
      'Oiapoque-Centro', 'Oiapoque-Clevelândia', 'Oiapoque-Vila Velha',
      'Porto Grande-Centro', 'Porto Grande-Vila Nova', 'Porto Grande-Munguba',
      'Porto Grande-Colônia Agrícola do Matapi', 'Porto Grande-Distrito do Cupixi',
      'Calçoene-Centro', 'Calçoene-Vila Carnot',
      'Serra do Navio-Vila Primária',
      'Amapá-Centro', 'Cutias-Centro', 'Ferreira Gomes-Centro', 'Itaubal-Centro',
      'Pedra Branca do Amapari-Centro', 'Pracuúba-Centro', 'Tartarugalzinho-Centro',
      'Vitória do Jari-Centro'
    ];

    function normaliza(s) {
      return s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    }

    const bairroInput = document.getElementById('l-bairro');
    const bairroList = document.getElementById('bairro-list');

    function renderBairros(filtro) {
      const termo = normaliza(filtro.trim());
      const itens = termo ? BAIRROS_MACAPA.filter(b => normaliza(b).includes(termo)) : BAIRROS_MACAPA;
      bairroList.innerHTML = '';
      if (!itens.length) {
        bairroList.innerHTML = '<div class="ac-empty">Nenhum bairro encontrado</div>';
      } else {
        itens.forEach(b => {
          const item = document.createElement('div');
          item.className = 'ac-item';
          item.textContent = b;
          item.addEventListener('mousedown', (e) => {
            e.preventDefault();
            bairroInput.value = b;
            bairroList.classList.remove('show');
          });
          bairroList.appendChild(item);
        });
      }
      bairroList.classList.add('show');
    }

    bairroInput.addEventListener('input', () => renderBairros(bairroInput.value));
    bairroInput.addEventListener('focus', () => renderBairros(bairroInput.value));

    let LIDERANCAS = [];
    fetch('/api/lideranca').then(r => r.json()).then(d => {
      LIDERANCAS = d.liderancas || [];
      // veio de um link exclusivo de liderança (?lid=005) — preenche sozinho
      const lid = Number(new URLSearchParams(location.search).get('lid'));
      if (lid) {
        const alvo = LIDERANCAS.find(l => Number(l.id) === lid);
        if (alvo) {
          document.getElementById('l-indicado').value = alvo.nome;
          document.getElementById('l-indicado-id').value = alvo.id;
        }
      }
    }).catch(() => {});

    const indicadoInput = document.getElementById('l-indicado');
    const indicadoIdInput = document.getElementById('l-indicado-id');
    const indicadoList = document.getElementById('indicado-list');

    function renderIndicados(filtro) {
      const termo = normaliza(filtro.trim());
      const itens = termo ? LIDERANCAS.filter(l => normaliza(l.nome).includes(termo)) : LIDERANCAS;
      indicadoList.innerHTML = '';
      if (!itens.length) {
        indicadoList.innerHTML = '<div class="ac-empty">Nenhuma liderança encontrada</div>';
      } else {
        itens.forEach(l => {
          const item = document.createElement('div');
          item.className = 'ac-item';
          item.textContent = l.nome;
          item.addEventListener('mousedown', (e) => {
            e.preventDefault();
            indicadoInput.value = l.nome;
            indicadoIdInput.value = l.id;
            indicadoList.classList.remove('show');
          });
          indicadoList.appendChild(item);
        });
      }
      indicadoList.classList.add('show');
    }

    indicadoInput.addEventListener('input', () => { indicadoIdInput.value = ''; renderIndicados(indicadoInput.value); });
    indicadoInput.addEventListener('focus', () => renderIndicados(indicadoInput.value));

    document.addEventListener('click', (e) => {
      if (!e.target.closest('#bairro-wrap')) bairroList.classList.remove('show');
      if (!e.target.closest('#indicado-wrap')) indicadoList.classList.remove('show');
    });

    const form = document.getElementById('form-apoiador');
    const btn = document.getElementById('btn-cadastrar');
    const msgErro = document.getElementById('msg-erro');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const nome = document.getElementById('l-nome').value.trim();
      const numero = document.getElementById('l-numero').value.trim();
      const bairro = document.getElementById('l-bairro').value.trim();
      const mae = document.getElementById('l-mae').value.trim();
      const nascimento = document.getElementById('l-nascimento').value.trim();
      const endereco = document.getElementById('l-endereco').value.trim();
      const indicadoPor = indicadoInput.value.trim();
      const indicadoPorId = indicadoIdInput.value.trim();
      msgErro.style.display = 'none';
      if (!nome || !numero || !bairro || !mae || !nascimento || !endereco) {
        msgErro.textContent = 'Preencha todos os campos obrigatórios.';
        msgErro.style.display = 'block';
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Enviando…';
      try {
        const res = await fetch('/api/apoiadores', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome, numero, bairro, mae, nascimento, endereco, indicadoPor, indicadoPorId: indicadoPorId || null })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Não foi possível enviar. Tente novamente.');
        form.style.display = 'none';
        document.getElementById('sucesso').style.display = 'block';
      } catch (err) {
        msgErro.textContent = err.message;
        msgErro.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Cadastrar';
      }
    });
  </script>
</body>

</html>
