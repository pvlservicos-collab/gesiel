<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Gesiel Oliveira</title>
  <link rel="icon" type="image/webp" href="/img/logo.webp">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      height: 100%;
      background: #000;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 6vw;
    }

    .logo {
      max-width: min(560px, 82vw);
      width: 100%;
      height: auto;
      animation: fadeIn 1.1s ease-out both;
    }

    .aviso {
      margin-top: 22px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: clamp(14px, 2.4vw, 18px);
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #f2f2ec;
      animation: fadeInSoft 1.1s ease-out both;
      animation-delay: .15s;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(.97)
      }

      to {
        opacity: 1;
        transform: scale(1)
      }
    }

    @keyframes fadeInSoft {
      from {
        opacity: 0;
      }

      to {
        opacity: .75;
      }
    }
  </style>
</head>

<body>
  <img class="logo" src="/img/logo.webp" alt="Gesiel Oliveira" />
  <p class="aviso">Site em construção</p>
</body>

</html>
